name: LB-827 probe — Windows filename truth

# Throwaway ground-truth probe for LB-827. Not part of the release pipeline,
# not gating anything. Runs the same real-filesystem probe on the same
# matrix as the main CI workflow, including ubuntu/macos as the POSIX
# control the ticket asks for. No repo deps are needed — the probe script
# only uses Node builtins — so there is no `npm ci` step here.

on:
  push:
    branches:
      - "probe/lb-827-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run ground-truth probe
        run: node .github/probes/lb-827-windows-filename-truth/probe.mjs
